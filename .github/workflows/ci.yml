name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # The same command as local: typecheck, lint, format:check, test, build and
      # the published-bundle secret scan (the site is public, anything in dist/ is readable).
      - name: Check
        run: npm run check
        env:
          VITE_BASE_PATH: ${{ vars.VITE_BASE_PATH }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
